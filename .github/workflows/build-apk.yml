name: Build APK

on:
  push:
    branches: [dev, preview, integration, main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [dev, preview, integration, main]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'integration' || github.base_ref == 'main')) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android/keystore.jks

      - name: Create key.properties
        run: |
          cat > app/android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Get version
        id: version
        working-directory: app
        run: |
          RAW=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          TAG=$(echo "$RAW" | sed 's/+/-build/')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw=$RAW" >> $GITHUB_OUTPUT

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: MyCareNK v${{ steps.version.outputs.raw }}
          body: |
            Build จาก branch `${{ github.ref_name }}` — commit `${{ github.sha }}`

            **ดาวน์โหลด:** `app-release.apk` ใต้ Assets ด้านล่าง
            **ติดตั้ง:** ต้องเปิด "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ในการตั้งค่า Android ก่อน
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: ${{ github.ref == 'refs/heads/integration' }}

      - name: Update app_versions in Supabase
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CLEAN_VERSION=$(echo '${{ steps.version.outputs.raw }}' | sed 's/+.*//' | sed 's/-beta.*//')
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.tag }}/app-release.apk"
          curl -sf -X POST "$SUPABASE_URL/rest/v1/app_versions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"$CLEAN_VERSION\",
              \"build_number\": ${{ github.run_number }},
              \"download_url\": \"$APK_URL\",
              \"branch\": \"${{ github.ref_name }}\"
            }"
