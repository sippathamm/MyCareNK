name: Build APK

on:
  push:
    branches: [dev, preview, integration, main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [dev, preview, integration, main]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'pull_request' && github.base_ref != 'preview' && github.base_ref != 'main') ||
      (github.event_name == 'push' && github.ref != 'refs/heads/preview' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Get version
        id: version
        working-directory: app
        run: |
          RAW=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          SEMVER=$(echo "$RAW" | sed 's/+.*//')
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Rename debug APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk \
            "MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk
          retention-days: 14

  build-debug-release:
    name: Debug + Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/preview') ||
      (github.event_name == 'pull_request' && github.base_ref == 'preview')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Get version
        id: version
        working-directory: app
        run: |
          RAW=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          SEMVER=$(echo "$RAW" | sed 's/+.*//')
          BUILD=$(echo "$RAW" | sed 's/.*+//')
          TAG="${SEMVER}-build$(printf '%03d' $BUILD)"
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw=$RAW" >> $GITHUB_OUTPUT

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android/keystore.jks

      - name: Create key.properties
        run: |
          cat > app/android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk \
            "MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "MyCareNK-v${{ steps.version.outputs.semver }}.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-debug-apk-${{ github.run_number }}
          path: MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk
          retention-days: 14

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-release-apk-${{ github.run_number }}
          path: MyCareNK-v${{ steps.version.outputs.semver }}.apk
          retention-days: 14

      - name: Create GitHub Prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: MyCareNK v${{ steps.version.outputs.raw }} (preview)
          body: |
            Preview build จาก branch `preview` — commit `${{ github.sha }}`

            **ดาวน์โหลด:** ดู Assets ด้านล่าง
            - `MyCareNK-v${{ steps.version.outputs.semver }}.apk` — release build (แนะนำ)
            - `MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk` — debug build
            
            **ติดตั้ง:** ต้องเปิด "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ในการตั้งค่า Android ก่อน
          files: |
            MyCareNK-v${{ steps.version.outputs.semver }}-debug.apk
            MyCareNK-v${{ steps.version.outputs.semver }}.apk
          prerelease: true

      - name: Insert download_url into app_versions (preview)
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.tag }}/MyCareNK-v${{ steps.version.outputs.semver }}.apk"
          curl -sf -X POST "$SUPABASE_URL/rest/v1/app_versions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"download_url\": \"$APK_URL\", \"branch\": \"preview\"}"

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android/keystore.jks

      - name: Create key.properties
        run: |
          cat > app/android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Get version
        id: version
        working-directory: app
        run: |
          RAW=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          BUILD=$(echo "$RAW" | sed 's/.*+//')
          TAG="$(echo "$RAW" | sed 's/+.*//')-build$(printf '%03d' $BUILD)"
          CLEAN_VERSION=$(echo "$RAW" | sed 's/+.*//' | sed 's/-.*//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw=$RAW" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Rename release APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "MyCareNK-v${{ steps.version.outputs.clean_version }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: MyCareNK-v${{ steps.version.outputs.clean_version }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: MyCareNK v${{ steps.version.outputs.raw }}
          body: |
            Release build จาก branch `main` — commit `${{ github.sha }}`

            **ดาวน์โหลด:** `MyCareNK-v${{ steps.version.outputs.clean_version }}.apk` ใต้ Assets ด้านล่าง
            **ติดตั้ง:** ต้องเปิด "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ในการตั้งค่า Android ก่อน
          files: MyCareNK-v${{ steps.version.outputs.clean_version }}.apk
          prerelease: false

      - name: Insert download_url into app_versions (main)
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.tag }}/MyCareNK-v${{ steps.version.outputs.clean_version }}.apk"
          curl -sf -X POST "$SUPABASE_URL/rest/v1/app_versions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"download_url\": \"$APK_URL\", \"branch\": \"main\"}"
