name: Build APK

# Channels — one branch, one channel, one GitHub Environment:
#
#   branch   pubspec version    tag                        artifacts
#   ------   ----------------   ------------------------   --------------------------
#   dev      X.Y.Z-dev+N        (none — no release)        debug APK (artifact only)
#   preview  X.Y.Z-preview+N    vX.Y.Z-preview-buildNNN    debug + release → Prerelease
#   main     X.Y.Z+N            vX.Y.Z-buildNNN            release → Release
#
# Every channel's version suffix is distinct, so tags and asset filenames can
# never collide across branches. The `resolve` job fails the run if a branch's
# pubspec suffix does not match its channel — that mismatch is what let a push
# to `preview` overwrite the `main` v1.0.0 release on 2026-07-21.
#
# Backend secrets live per-Environment (dev/preview/main), never repo-level, so
# re-pointing one channel at a different Supabase project cannot silently leak
# into another. Only the signing keystore is shared repo-level.
#
# Note: GitHub evaluates `paths` against every commit in a push, not just the
# head commit, so a push whose range contains an `app/**` commit triggers this
# workflow even when the head commit touches nothing under `app/`.

on:
  push:
    branches: [dev, preview, main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [dev, preview, main]
    paths:
      - 'app/**'
  workflow_dispatch:

# One run per branch. Never cancel: a cancelled run can leave a release created
# with its assets half-uploaded.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  resolve:
    name: Resolve channel and version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      semver: ${{ steps.version.outputs.semver }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.version.outputs.apk }}
      debug_apk: ${{ steps.version.outputs.debug_apk }}
      build_debug: ${{ steps.plan.outputs.build_debug }}
      build_release: ${{ steps.plan.outputs.build_release }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANNEL="${{ github.base_ref }}"
          else
            CHANNEL="${{ github.ref_name }}"
          fi
          case "$CHANNEL" in
            dev|preview|main) ;;
            *) echo "::error::Unsupported channel '$CHANNEL' (expected dev, preview, or main)"; exit 1 ;;
          esac
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Channel: $CHANNEL"

      - name: Parse and verify version
        id: version
        working-directory: app
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          RAW=$(grep "^version:" pubspec.yaml | sed 's/version: *//')
          SEMVER="${RAW%%+*}"
          BUILD="${RAW##*+}"

          if [ "$SEMVER" = "$RAW" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec version '$RAW' has no +BUILD part"
            exit 1
          fi
          if ! echo "$BUILD" | grep -qE '^[0-9]+$'; then
            echo "::error::pubspec build number '$BUILD' is not numeric"
            exit 1
          fi

          # The guard: a branch may only build a version carrying its own suffix.
          case "$CHANNEL" in
            dev)
              EXPECT='X.Y.Z-dev+N'
              echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-dev$' || FAIL=1 ;;
            preview)
              EXPECT='X.Y.Z-preview+N'
              echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-preview$' || FAIL=1 ;;
            main)
              EXPECT='X.Y.Z+N (no pre-release suffix)'
              echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || FAIL=1 ;;
          esac
          if [ "${FAIL:-0}" = "1" ]; then
            echo "::error::Branch '$CHANNEL' requires version $EXPECT but app/pubspec.yaml says '$RAW'."
            echo "::error::Building it would produce a tag belonging to another channel. Fix pubspec.yaml first."
            exit 1
          fi

          TAG="v${SEMVER}-build$(printf '%03d' "$BUILD")"
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk=MyCareNK-${TAG}.apk" >> $GITHUB_OUTPUT
          echo "debug_apk=MyCareNK-${TAG}-debug.apk" >> $GITHUB_OUTPUT
          echo "$CHANNEL $RAW -> $TAG"

      - name: Plan outputs for this channel
        id: plan
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          case "$CHANNEL" in
            dev)     BUILD_DEBUG=true;  BUILD_RELEASE=false; PRERELEASE=true  ;;
            preview) BUILD_DEBUG=true;  BUILD_RELEASE=true;  PRERELEASE=true  ;;
            main)    BUILD_DEBUG=false; BUILD_RELEASE=true;  PRERELEASE=false ;;
          esac
          # Publish only on a real push to a release channel. Pull requests and
          # manual dispatches build and upload artifacts but never create a
          # release, move a tag, or write to app_versions.
          PUBLISH=false
          if [ "${{ github.event_name }}" = "push" ] && [ "$CHANNEL" != "dev" ]; then
            PUBLISH=true
          fi
          echo "build_debug=$BUILD_DEBUG" >> $GITHUB_OUTPUT
          echo "build_release=$BUILD_RELEASE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "publish=$PUBLISH" >> $GITHUB_OUTPUT

      - name: Refuse to overwrite an existing release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the build number in app/pubspec.yaml"
            echo "::error::instead of rebuilding — overwriting a published release replaces the APK"
            echo "::error::users already downloaded."
            exit 1
          fi

  build:
    name: Build ${{ needs.resolve.outputs.channel }} APK
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.channel }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        working-directory: app
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL is not set on the '${{ needs.resolve.outputs.channel }}' environment."
            echo "::error::Each channel carries its own backend secrets — set them in"
            echo "::error::Settings → Environments → ${{ needs.resolve.outputs.channel }}."
            exit 1
          fi
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        if: needs.resolve.outputs.build_debug == 'true'
        working-directory: app
        run: flutter build apk --debug

      - name: Decode keystore
        if: needs.resolve.outputs.build_release == 'true'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/android/keystore.jks

      - name: Create key.properties
        if: needs.resolve.outputs.build_release == 'true'
        run: |
          cat > app/android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: needs.resolve.outputs.build_release == 'true'
        working-directory: app
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          if [ "${{ needs.resolve.outputs.build_debug }}" = "true" ]; then
            cp app/build/app/outputs/flutter-apk/app-debug.apk "${{ needs.resolve.outputs.debug_apk }}"
          fi
          if [ "${{ needs.resolve.outputs.build_release }}" = "true" ]; then
            cp app/build/app/outputs/flutter-apk/app-release.apk "${{ needs.resolve.outputs.apk }}"
          fi
          ls -lh MyCareNK-*.apk

      - name: Upload debug APK artifact
        if: needs.resolve.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.channel }}-debug-${{ github.run_number }}
          path: ${{ needs.resolve.outputs.debug_apk }}
          retention-days: 14

      - name: Upload release APK artifact
        if: needs.resolve.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.channel }}-release-${{ github.run_number }}
          path: ${{ needs.resolve.outputs.apk }}
          retention-days: 30

      # `gh release create` fails when the tag already exists — unlike an
      # action that updates a release in place, which is how a preview build
      # silently took over the main v1.0.0 release.
      - name: Create GitHub Release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
          APK: ${{ needs.resolve.outputs.apk }}
          DEBUG_APK: ${{ needs.resolve.outputs.debug_apk }}
        run: |
          if [ "$CHANNEL" = "main" ]; then
            TITLE="MyCareNK ${{ needs.resolve.outputs.semver }}"
            NOTES=$(cat <<EOF
          Release build จาก branch \`main\` — commit \`${{ github.sha }}\`

          **ดาวน์โหลด:** \`$APK\` ใต้ Assets ด้านล่าง
          **ติดตั้ง:** ต้องเปิด "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ในการตั้งค่า Android ก่อน
          EOF
            )
            FILES="$APK"
          else
            TITLE="MyCareNK ${{ needs.resolve.outputs.semver }} (build ${{ needs.resolve.outputs.build }})"
            NOTES=$(cat <<EOF
          Preview build จาก branch \`preview\` — commit \`${{ github.sha }}\`

          **ดาวน์โหลด:** ดู Assets ด้านล่าง
          - \`$APK\` — release build (แนะนำ)
          - \`$DEBUG_APK\` — debug build

          **ติดตั้ง:** ต้องเปิด "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ในการตั้งค่า Android ก่อน
          EOF
            )
            FILES="$APK $DEBUG_APK"
          fi

          PRERELEASE_FLAG=""
          if [ "${{ needs.resolve.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" $FILES \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG

      - name: Insert download_url into app_versions
        if: needs.resolve.outputs.publish == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/${{ needs.resolve.outputs.apk }}"
          CODE=$(curl -sS -o /tmp/insert.log -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/app_versions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"download_url\": \"$APK_URL\", \"branch\": \"${{ needs.resolve.outputs.channel }}\"}") || true
          echo "HTTP $CODE"
          cat /tmp/insert.log || true
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::error::app_versions insert failed (HTTP $CODE). The release exists but the"
            echo "::error::in-app update row was not created — check the SUPABASE_URL and"
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secrets on the '${{ needs.resolve.outputs.channel }}' environment."
            exit 1
          fi
