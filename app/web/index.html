<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- No viewport-fit=cover: Flutter web does not report safe-area insets, so
       content must stay inside the safe area that iOS letterboxes for us. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="บริการถุงยางอนามัย ประเมินความเสี่ยง HIV และนัดรับคำปรึกษา จังหวัดหนองคาย">
  <meta name="theme-color" content="#FF9F6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyCareNK">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyCareNK</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FFFFFF;
      transition: opacity .25s ease-out;
    }
    #app-loading img { width: 96px; height: 96px; border-radius: 22px; }
    #app-loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app-loading"><img src="icons/Icon-192.png" alt="MyCareNK"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
